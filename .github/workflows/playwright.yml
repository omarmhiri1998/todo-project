name: Todo CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend
        working-directory: backend
        run: npm install

      - name: Run Jest tests
        working-directory: backend
        run: npx jest tests/integration.test.js tests/jest_test_version.test.js

      - name: Install frontend
        working-directory: frontend/my-app
        run: npm install

      - name: Install Playwright
        working-directory: backend
        run: npx playwright install --with-deps chromium

      - name: Start backend
        working-directory: backend
        run: node server.js > backend.log 2>&1 &

      - name: Start frontend
        working-directory: frontend/my-app
        run: npm run dev -- --host 0.0.0.0 --strictPort > frontend.log 2>&1 &

      - name: Wait for app
        run: npx -y wait-on --timeout 30000 http-get://127.0.0.1:3070/ http-get://127.0.0.1:5173/

      - name: Run Playwright
        working-directory: backend
        run: npx playwright test