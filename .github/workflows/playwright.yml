name: Todo CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm install

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Install frontend dependencies
        working-directory: frontend/my-app
        run: npm install

      - name: Run Jest
        working-directory: backend
        run: npx jest tests/integration.test.js tests/jest_test_version.test.js

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start application
        run: npm run dev &

      - name: Wait for application
        run: npx -y wait-on --timeout 30000 http-get://127.0.0.1:3070/ http-get://127.0.0.1:5173/

      - name: Run Playwright
        run: npx playwright test backend/tests/tests/getTodos.spec.js