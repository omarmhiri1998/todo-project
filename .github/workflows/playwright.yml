name: Todo CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend
        run: npm install
        working-directory: backend

      - name: Run Jest
        run: npx jest tests/integration.test.js tests/jest_test_version.test.js
        working-directory: backend

      - name: Install frontend
        run: npm install
        working-directory: frontend/my-app

      - name: Install Playwright
        run: npx playwright install --with-deps chromium
        working-directory: backend

      - name: Start backend
        run: node server.js &
        working-directory: backend

      - name: Start frontend
        run: npm run dev -- --host 0.0.0.0 &
        working-directory: frontend/my-app

      - name: Wait for app
        run: npx -y wait-on http://localhost:3070 http://localhost:5173

      - name: Run Playwright
        run: npx playwright test tests/tests/getTodos.spec.js
        working-directory: backend